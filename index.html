<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 6rem;
      color: #333;
      letter-spacing: 0.1em;
      text-shadow: 2px 4px 8px rgba(0,0,0,0.15);
      animation: wave 1.5s ease-in-out infinite alternate;
      margin-top: 2rem;
    }

    @keyframes wave {
      from { transform: rotate(-5deg) scale(1); }
      to   { transform: rotate(5deg)  scale(1.05); }
    }

    .balloon-container {
      position: relative;
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
    }

    .balloon {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: float 3s ease-in-out infinite;
      cursor: pointer;
    }

    .balloon:nth-child(2) { animation-delay: 0.5s; }
    .balloon:nth-child(3) { animation-delay: 1s; }
    .balloon:nth-child(4) { animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-20px) rotate(3deg); }
    }

    .balloon-body {
      width: 80px;
      height: 100px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      position: relative;
      box-shadow: inset -8px -8px 20px rgba(0,0,0,0.15), 4px 4px 12px rgba(0,0,0,0.1);
    }

    .balloon-body::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 18px;
      width: 20px;
      height: 28px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    .balloon-knot {
      width: 10px;
      height: 12px;
      background: inherit;
      filter: brightness(0.7);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      margin-top: -1px;
    }

    .balloon-string {
      width: 1px;
      height: 80px;
      background: rgba(0,0,0,0.25);
      border-left: 1.5px dashed rgba(0,0,0,0.2);
      position: relative;
    }

    /* Balloon colors */
    .balloon:nth-child(1) .balloon-body { background: #ff6b6b; }
    .balloon:nth-child(1) .balloon-knot { background: #cc4444; }

    .balloon:nth-child(2) .balloon-body { background: #ffd93d; }
    .balloon:nth-child(2) .balloon-knot { background: #ccaa00; }

    .balloon:nth-child(3) .balloon-body { background: #6bcb77; }
    .balloon:nth-child(3) .balloon-knot { background: #449950; }

    .balloon:nth-child(4) .balloon-body { background: #4d96ff; }
    .balloon:nth-child(4) .balloon-knot { background: #2255cc; }

    /* ── Balloon pop ── */
    .balloon.pop { animation: none !important; cursor: default; }

    .balloon.pop .balloon-body { animation: pop-burst 0.35s ease-out forwards !important; }

    .balloon.pop .balloon-knot,
    .balloon.pop .balloon-string { opacity: 0; }

    @keyframes pop-burst {
      0%   { transform: scale(1);   opacity: 1; }
      40%  { transform: scale(1.5); opacity: 0.8; }
      100% { transform: scale(0);   opacity: 0; }
    }

    /* ── Spider-Man fall ── */
    #spiderman-wrap.falling { animation: none !important; }

    #spiderman-wrap.falling #web-line {
      animation: web-snap 0.2s ease-out forwards;
    }

    @keyframes web-snap {
      0%   { opacity: 1; height: 60px; }
      100% { opacity: 0; height: 0px; }
    }

    #spiderman-wrap.falling #spiderman-body {
      animation: spidey-fall 1.2s ease-in forwards !important;
    }

    @keyframes spidey-fall {
      0%   { transform: rotate(0deg)    translateY(0);     opacity: 1; }
      30%  { transform: rotate(60deg)   translateY(80px);  opacity: 1; }
      70%  { transform: rotate(180deg)  translateY(300px); opacity: 1; }
      100% { transform: rotate(270deg)  translateY(120vh); opacity: 0; }
    }

    /* ── Spider-Man banner pose ── */
    #spiderman-wrap.banner-pose { animation: none !important; left: 50% !important; top: 30px !important; transform: translateX(-50%); }
    #spiderman-wrap.banner-pose #spiderman-body { animation: none !important; transform: rotate(0deg); }
    #spiderman-wrap.banner-pose #web-line { display: none; }

    /* ── Banner ── */
    #banner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 200;
      background: linear-gradient(135deg, #fff 0%, #fffbe6 100%);
      border: 4px solid #cc0000;
      border-radius: 16px;
      padding: 2rem 3rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25);
      cursor: pointer;
      animation: none;
    }

    #banner.show {
      display: block;
      animation: banner-pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes banner-pop-in {
      0%   { transform: translate(-50%, -50%) scale(0) rotate(-8deg); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg);  opacity: 1; }
    }

    #banner h2 {
      font-size: 3rem;
      background: linear-gradient(90deg, #cc0000, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    #banner p {
      margin-top: 0.5rem;
      color: #888;
      font-size: 0.9rem;
    }

    /* ── Spider-Man ── */
    #spiderman-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    #spiderman-body {
      cursor: pointer;
      pointer-events: all;
    }

    #spiderman-body:hover #spiderman-svg {
      filter: drop-shadow(0 0 10px rgba(255,50,50,0.9));
    }

    #spiderman-wrap {
      position: absolute;
      top: 0; left: -120px;
      animation: swing-across 6s ease-in-out infinite;
      transform-origin: top center;
    }

    @keyframes swing-across {
      0%   { left: -120px; top: 40px; }
      25%  { top: 120px; }
      50%  { left: 55%;   top: 40px; }
      75%  { top: 120px; }
      100% { left: calc(100% + 120px); top: 40px; }
    }

    #spiderman-body {
      animation: pendulum 1.2s ease-in-out infinite alternate;
      transform-origin: top center;
    }

    @keyframes pendulum {
      from { transform: rotate(-30deg); }
      to   { transform: rotate(20deg); }
    }

    #web-line {
      position: absolute;
      top: -60px;
      left: 50%;
      width: 2px;
      height: 60px;
      background: rgba(255,255,255,0.85);
      transform-origin: top center;
      transform: translateX(-50%);
    }

    #spiderman-svg {
      width: 70px;
      height: 70px;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
      --spidey-primary: #cc0000;
      --spidey-secondary: #1a1aff;
    }

    .spidey-primary    { fill: var(--spidey-primary); }
    .spidey-primary-s  { stroke: var(--spidey-primary); }
    .spidey-secondary  { fill: var(--spidey-secondary); }
    .spidey-secondary-s { stroke: var(--spidey-secondary); }
  </style>
</head>
<body>

  <div class="balloon-container">
    <div class="balloon" data-color="red">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
    <div class="balloon" data-color="yellow">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
    <div class="balloon" data-color="green">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
    <div class="balloon" data-color="blue">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
  </div>

  <h1>Hi!</h1>

  <!-- Banner -->
  <div id="banner">
    <h2>You Did It!</h2>
    <p>Click to play again</p>
  </div>

  <!-- Spider-Man swinging scene -->
  <div id="spiderman-scene">
    <div id="spiderman-wrap">
      <div id="web-line"></div>
      <div id="spiderman-body">
        <svg id="spiderman-svg" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
          <!-- Body -->
          <ellipse cx="50" cy="58" rx="16" ry="20" class="spidey-primary"/>
          <ellipse cx="50" cy="58" rx="16" ry="20" fill="none" class="spidey-primary-s" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
          <ellipse cx="50" cy="55" rx="5" ry="3" fill="#000" opacity="0.5"/>

          <!-- Head -->
          <circle cx="50" cy="32" r="16" class="spidey-primary"/>
          <ellipse cx="43" cy="29" rx="6" ry="7" fill="white"/>
          <ellipse cx="57" cy="29" rx="6" ry="7" fill="white"/>
          <ellipse cx="43" cy="29" rx="4" ry="5" fill="#111"/>
          <ellipse cx="57" cy="29" rx="4" ry="5" fill="#111"/>
          <line x1="50" y1="16" x2="50" y2="48" class="spidey-primary-s" stroke-width="1" opacity="0.5"/>
          <line x1="34" y1="16" x2="66" y2="48" class="spidey-primary-s" stroke-width="1" opacity="0.5"/>
          <line x1="66" y1="16" x2="34" y2="48" class="spidey-primary-s" stroke-width="1" opacity="0.5"/>
          <line x1="34" y1="32" x2="66" y2="32" class="spidey-primary-s" stroke-width="1" opacity="0.5"/>
          <ellipse cx="50" cy="32" r="10" fill="none" class="spidey-primary-s" stroke-width="1" opacity="0.5"/>
          <ellipse cx="50" cy="32" r="6"  fill="none" class="spidey-primary-s" stroke-width="1" opacity="0.5"/>

          <!-- Arms (banner pose: both arms out holding banner corners) -->
          <g id="arms-swing">
            <line x1="34" y1="52" x2="10" y2="30" class="spidey-primary-s" stroke-width="8" stroke-linecap="round"/>
            <circle cx="10" cy="30" r="5" class="spidey-primary"/>
            <line x1="10" y1="30" x2="0" y2="10" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
            <line x1="66" y1="52" x2="88" y2="65" class="spidey-primary-s" stroke-width="8" stroke-linecap="round"/>
            <circle cx="88" cy="65" r="5" class="spidey-primary"/>
          </g>
          <g id="arms-banner" display="none">
            <line x1="34" y1="52" x2="5"  y2="52" class="spidey-primary-s" stroke-width="8" stroke-linecap="round"/>
            <circle cx="5"  cy="52" r="5" class="spidey-primary"/>
            <line x1="66" y1="52" x2="95" y2="52" class="spidey-primary-s" stroke-width="8" stroke-linecap="round"/>
            <circle cx="95" cy="52" r="5" class="spidey-primary"/>
            <!-- Banner held between hands -->
            <rect x="5" y="60" width="90" height="36" rx="4" fill="white" stroke="#cc0000" stroke-width="2"/>
            <text x="50" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#cc0000" font-family="Arial, sans-serif">YOU DID IT!</text>
          </g>

          <!-- Legs -->
          <line x1="44" y1="76" x2="36" y2="95" class="spidey-primary-s" stroke-width="8" stroke-linecap="round"/>
          <line x1="56" y1="76" x2="64" y2="95" class="spidey-primary-s" stroke-width="8" stroke-linecap="round"/>
          <ellipse cx="36" cy="95" rx="7" ry="5" class="spidey-secondary"/>
          <ellipse cx="64" cy="95" rx="7" ry="5" class="spidey-secondary"/>
          <path d="M34 52 Q20 65 36 95" fill="none" class="spidey-secondary-s" stroke-width="6" stroke-linecap="round"/>
          <path d="M66 52 Q80 65 64 95" fill="none" class="spidey-secondary-s" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const COLOR_MAP = {
      red:    '#ff6b6b',
      yellow: '#ffd93d',
      green:  '#6bcb77',
      blue:   '#4d96ff'
    };

    let poppedColors = [];
    let allPopped = false;

    function applySpideyColors(c1, c2) {
      const svg = document.getElementById('spiderman-svg');
      svg.style.setProperty('--spidey-primary', c1);
      svg.style.setProperty('--spidey-secondary', c2);
      svg.style.filter = 'drop-shadow(0 0 12px ' + c1 + ') drop-shadow(0 0 12px ' + c2 + ')';
      setTimeout(function () {
        svg.style.filter = 'drop-shadow(2px 4px 6px rgba(0,0,0,0.4))';
      }, 600);
    }

    function checkSpideyFall() {
      if (poppedColors.includes('red') && poppedColors.includes('blue') && !allPopped) {
        document.getElementById('spiderman-wrap').classList.add('falling');
      }
    }

    function checkAllPopped() {
      const balloons = document.querySelectorAll('.balloon');
      const allGone = Array.from(balloons).every(function (b) { return b.classList.contains('pop'); });
      if (allGone && !allPopped) {
        allPopped = true;
        setTimeout(showBannerPose, 400);
      }
    }

    function showBannerPose() {
      const wrap = document.getElementById('spiderman-wrap');
      // stop falling/swinging, center him
      wrap.classList.remove('falling');
      wrap.classList.add('banner-pose');
      // swap arms
      document.getElementById('arms-swing').setAttribute('display', 'none');
      document.getElementById('arms-banner').setAttribute('display', 'block');
      // show overlay banner
      const banner = document.getElementById('banner');
      banner.classList.add('show');
    }

    function reset() {
      allPopped = false;
      poppedColors = [];

      // reset balloons
      document.querySelectorAll('.balloon').forEach(function (b) {
        b.classList.remove('pop');
      });

      // reset Spider-Man
      const wrap = document.getElementById('spiderman-wrap');
      wrap.classList.remove('falling', 'banner-pose');
      wrap.style.left = '-120px';
      wrap.style.top = '0';
      wrap.style.transform = '';

      const svg = document.getElementById('spiderman-svg');
      svg.style.setProperty('--spidey-primary', '#cc0000');
      svg.style.setProperty('--spidey-secondary', '#1a1aff');
      svg.style.filter = 'drop-shadow(2px 4px 6px rgba(0,0,0,0.4))';

      document.getElementById('arms-swing').setAttribute('display', 'block');
      document.getElementById('arms-banner').setAttribute('display', 'none');

      // hide banner
      const banner = document.getElementById('banner');
      banner.classList.remove('show');
      banner.style.display = 'none';
      // force reflow so animation replays next time
      void banner.offsetWidth;
      banner.style.display = '';
    }

    function handleBalloonPop(balloon) {
      if (balloon.classList.contains('pop')) return;
      balloon.classList.add('pop');
      const color = balloon.dataset.color;
      poppedColors.push(color);

      if (poppedColors.length === 2) {
        applySpideyColors(COLOR_MAP[poppedColors[0]], COLOR_MAP[poppedColors[1]]);
      }
      checkSpideyFall();
      checkAllPopped();
    }

    // Click individual balloons
    document.querySelectorAll('.balloon').forEach(function (balloon) {
      balloon.addEventListener('click', function () {
        handleBalloonPop(balloon);
      });
    });

    // Click Spider-Man pops all balloons
    document.getElementById('spiderman-body').addEventListener('click', function () {
      document.querySelectorAll('.balloon').forEach(function (balloon, i) {
        setTimeout(function () { handleBalloonPop(balloon); }, i * 120);
      });
    });

    // Click banner to reset
    document.getElementById('banner').addEventListener('click', reset);
  </script>
</body>
</html>
