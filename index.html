<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: 6rem;
      color: #333;
      letter-spacing: 0.1em;
      text-shadow: 2px 4px 8px rgba(0,0,0,0.15);
      animation: wave 1.5s ease-in-out infinite alternate;
      margin-top: 2rem;
    }

    @keyframes wave {
      from { transform: rotate(-5deg) scale(1); }
      to   { transform: rotate(5deg)  scale(1.05); }
    }

    .balloon-container {
      position: relative;
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
    }

    .balloon {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: float 3s ease-in-out infinite;
    }

    .balloon:nth-child(2) { animation-delay: 0.5s; }
    .balloon:nth-child(3) { animation-delay: 1s; }
    .balloon:nth-child(4) { animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-20px) rotate(3deg); }
    }

    .balloon-body {
      width: 80px;
      height: 100px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      position: relative;
      box-shadow: inset -8px -8px 20px rgba(0,0,0,0.15), 4px 4px 12px rgba(0,0,0,0.1);
    }

    .balloon-body::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 18px;
      width: 20px;
      height: 28px;
      background: rgba(255,255,255,0.35);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    .balloon-knot {
      width: 10px;
      height: 12px;
      background: inherit;
      filter: brightness(0.7);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      margin-top: -1px;
    }

    .balloon-string {
      width: 1px;
      height: 80px;
      background: rgba(0,0,0,0.25);
      border-left: 1.5px dashed rgba(0,0,0,0.2);
      position: relative;
    }

    /* Balloon colors */
    .balloon:nth-child(1) .balloon-body { background: #ff6b6b; }
    .balloon:nth-child(1) .balloon-knot { background: #cc4444; }

    .balloon:nth-child(2) .balloon-body { background: #ffd93d; }
    .balloon:nth-child(2) .balloon-knot { background: #ccaa00; }

    .balloon:nth-child(3) .balloon-body { background: #6bcb77; }
    .balloon:nth-child(3) .balloon-knot { background: #449950; }

    .balloon:nth-child(4) .balloon-body { background: #4d96ff; }
    .balloon:nth-child(4) .balloon-knot { background: #2255cc; }

    /* ── Spider-Man ── */
    #spiderman-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    #spiderman-wrap {
      position: absolute;
      top: 0; left: -120px;
      animation: swing-across 6s ease-in-out infinite;
      transform-origin: top center;
    }

    /* horizontal travel */
    @keyframes swing-across {
      0%   { left: -120px; top: 40px; }
      25%  { top: 120px; }
      50%  { left: 55%;   top: 40px; }
      75%  { top: 120px; }
      100% { left: calc(100% + 120px); top: 40px; }
    }

    /* pendulum body swing */
    #spiderman-body {
      animation: pendulum 1.2s ease-in-out infinite alternate;
      transform-origin: top center;
    }

    @keyframes pendulum {
      from { transform: rotate(-30deg); }
      to   { transform: rotate(20deg); }
    }

    /* the web line */
    #web-line {
      position: absolute;
      top: -60px;
      left: 50%;
      width: 2px;
      height: 60px;
      background: rgba(255,255,255,0.85);
      transform-origin: top center;
      transform: translateX(-50%);
    }

    /* SVG Spidey */
    #spiderman-svg {
      width: 70px;
      height: 70px;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
    }
  </style>
</head>
<body>

  <div class="balloon-container">
    <div class="balloon">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
    <div class="balloon">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
    <div class="balloon">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
    <div class="balloon">
      <div class="balloon-body"></div>
      <div class="balloon-knot"></div>
      <div class="balloon-string"></div>
    </div>
  </div>

  <h1>Hi!</h1>

  <!-- Spider-Man swinging scene -->
  <div id="spiderman-scene">
    <div id="spiderman-wrap">
      <div id="web-line"></div>
      <div id="spiderman-body">
        <!-- SVG Spider-Man figure -->
        <svg id="spiderman-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Body -->
          <ellipse cx="50" cy="58" rx="16" ry="20" fill="#cc0000"/>
          <!-- Web pattern on body -->
          <ellipse cx="50" cy="58" rx="16" ry="20" fill="none" stroke="#8b0000" stroke-width="1"
            stroke-dasharray="3 3"/>
          <!-- Chest spider symbol -->
          <ellipse cx="50" cy="55" rx="5" ry="3" fill="#000" opacity="0.6"/>

          <!-- Head -->
          <circle cx="50" cy="32" r="16" fill="#cc0000"/>
          <!-- Mask eyes (white lenses) -->
          <ellipse cx="43" cy="29" rx="6" ry="7" fill="white"/>
          <ellipse cx="57" cy="29" rx="6" ry="7" fill="white"/>
          <!-- Eye inner (black) -->
          <ellipse cx="43" cy="29" rx="4" ry="5" fill="#111"/>
          <ellipse cx="57" cy="29" rx="4" ry="5" fill="#111"/>
          <!-- Web lines on head -->
          <line x1="50" y1="16" x2="50" y2="48" stroke="#8b0000" stroke-width="1"/>
          <line x1="34" y1="16" x2="66" y2="48" stroke="#8b0000" stroke-width="1"/>
          <line x1="66" y1="16" x2="34" y2="48" stroke="#8b0000" stroke-width="1"/>
          <line x1="34" y1="32" x2="66" y2="32" stroke="#8b0000" stroke-width="1"/>
          <ellipse cx="50" cy="32" r="10" fill="none" stroke="#8b0000" stroke-width="1"/>
          <ellipse cx="50" cy="32" r="6"  fill="none" stroke="#8b0000" stroke-width="1"/>

          <!-- Left arm (extended up-right for web-shooting) -->
          <line x1="34" y1="52" x2="10" y2="30" stroke="#cc0000" stroke-width="8" stroke-linecap="round"/>
          <!-- Left hand -->
          <circle cx="10" cy="30" r="5" fill="#cc0000"/>
          <!-- Web shooting from hand -->
          <line x1="10" y1="30" x2="0" y2="10" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>

          <!-- Right arm (trailing back) -->
          <line x1="66" y1="52" x2="88" y2="65" stroke="#cc0000" stroke-width="8" stroke-linecap="round"/>
          <circle cx="88" cy="65" r="5" fill="#cc0000"/>

          <!-- Legs -->
          <line x1="44" y1="76" x2="36" y2="95" stroke="#cc0000" stroke-width="8" stroke-linecap="round"/>
          <line x1="56" y1="76" x2="64" y2="95" stroke="#cc0000" stroke-width="8" stroke-linecap="round"/>
          <!-- Boots (blue) -->
          <ellipse cx="36" cy="95" rx="7" ry="5" fill="#1a1aff"/>
          <ellipse cx="64" cy="95" rx="7" ry="5" fill="#1a1aff"/>

          <!-- Blue side panels -->
          <path d="M34 52 Q20 65 36 95" fill="none" stroke="#1a1aff" stroke-width="6" stroke-linecap="round"/>
          <path d="M66 52 Q80 65 64 95" fill="none" stroke="#1a1aff" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
